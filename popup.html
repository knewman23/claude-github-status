<!doctype html>
<meta charset="utf-8">
<title>Dev PTO</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #faf9f7;
    --fg: #1a1a18;
    --muted: #6b6862;
    --line: #e6e2db;
    --card: #ffffff;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#1c1b19; --fg:#f2efe9; --muted:#9a958c; --line:#332f2b; --card:#242220; }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; width: 320px; max-height: 560px; overflow-y: auto;
    font: 13px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: var(--bg); color: var(--fg);
  }
  .dot { width: 10px; height: 10px; border-radius: 50%; flex: none; }
  .service { padding: 12px 14px; }
  .service + .service { border-top: 1px solid var(--line); }
  .service-head { display: flex; align-items: center; gap: 9px; margin-bottom: 4px; }
  .service-name {
    flex: 1; font-size: 10.5px; letter-spacing: .07em; text-transform: uppercase;
    color: var(--muted); font-weight: 600;
  }
  .overall { font-weight: 600; font-size: 13.5px; margin: 0 0 10px 19px; }
  .rows { display: flex; flex-direction: column; gap: 7px; margin-left: 19px; }
  .row { display: flex; align-items: center; gap: 8px; }
  .row .name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .row .state { color: var(--muted); font-size: 11.5px; text-transform: capitalize; }
  .incidents { margin: 0 0 10px 19px; }
  .incident { background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 9px 10px; margin-bottom: 8px; }
  .incident b { display: block; margin-bottom: 3px; }
  .incident p { margin: 0; color: var(--muted); font-size: 11.5px; max-height: 4.5em; overflow: hidden; }
  footer {
    display: flex; align-items: center; justify-content: space-between;
    padding: 10px 14px; border-top: 1px solid var(--line);
    color: var(--muted); font-size: 11px;
    position: sticky; bottom: 0; background: var(--bg);
  }
  a, button {
    color: var(--muted); font: inherit; font-size: 11px; background: none; border: 0;
    padding: 0; cursor: pointer; text-decoration: none;
  }
  a:hover, button:hover { color: var(--fg); }
  button:hover { text-decoration: underline; }
</style>

<div id="services">
  <section class="service"><div class="overall">Loading…</div></section>
</div>

<footer>
  <span id="stamp"></span>
  <button id="refresh">Refresh</button>
</footer>

<script src="popup.js"></script>
